    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />

    <meta name="twitter:description"
        content="Software engineer building modern mobile and backend applications with Flutter, Kotlin, Dart and Go." />
    <meta name="twitter:image" content="https://amiralitaherkhany.ir/icons/icon-512.png" />

    <!-- Screenshot galleries are served from GitHub. -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

    <link rel="manifest" href="manifest.json" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000000;
        }

        body {
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .indicator {
            width: 50vw;
            max-width: 300px;
            height: auto;
        }

        @media (max-width: 600px) {
            .indicator {
                width: 70vw;
                max-width: 90vw;
            }
        }
    </style>
</head>

<body>
    <div id="loading_indicator" class="container">
        <img class="indicator" src="./assets/loading.gif" alt="" />
    </div>
    <script src="flutter_bootstrap.js" async></script>
    <script>
        // Remove the loading indicator as soon as Flutter paints its first
        // frame, with a timeout as a safety net in case the event is missed.
        (function () {
            var removed = false;
            var indicator = document.getElementById("loading_indicator");

            function hide() {
                if (removed || !indicator) return;
                removed = true;
                indicator.remove();
            }

            window.addEventListener("flutter-first-frame", hide);
            window.addEventListener("load", function () {
                setTimeout(hide, 15000);
            });
        })();
    </script>
</body>

</html>
