
name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Analyse and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Test
        run: flutter test

  deploy:
    name: Deploy to GitHub Pages
    needs: quality
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      
      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --pwa-strategy=none \
            --base-href "/" \
            --no-web-resources-cdn \

      # - name: Configure CanvasKit URL
      #   run: |
      #     python3 - <<'PY'
      #     from pathlib import Path

      #     path = Path("build/web/flutter_bootstrap.js")
      #     content = path.read_text()

      #     needle = "_flutter.loader.load({"

      #     if needle not in content:
      #         raise RuntimeError("Flutter loader configuration not found!")

      #     config = '''_flutter.loader.load({
      #       config: {
      #         canvasKitBaseUrl: "https://amiralitaherkhany.ir/canvaskit/"
      #       },'''

      #     content = content.replace(needle, config, 1)
      #     path.write_text(content)

      #     print("CanvasKit URL configured successfully.")
      #     PY

      - name: Create CNAME
        run: echo "amiralitaherkhany.ir" > build/web/CNAME

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: build/web

      - name: Deploy Pages
        uses: actions/deploy-pages@v5
        id: deployment
        with:
          artifact_name: github-pages

      - name: Show Deployment URL
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"

